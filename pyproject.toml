[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sighextraimage"
version = "0.2.0"
description = "Physics-guided out-of-frame inference from weak boundary light"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pillow"]

[project.optional-dependencies]
gui = ["gradio>=5,<6"]
outpaint = ["gradio>=5,<6", "diffusers>=0.35.2,<0.36", "transformers>=4.44,<5", "accelerate>=0.30", "safetensors>=0.4"]
plot = ["matplotlib"]
test = ["pytest"]

[project.scripts]
sighextraimage = "sighextraimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
